apiVersion: 1
prune: true
deleteDatasources:
  - name: Prometheus-Censys
    orgId: 1
  - name: Prometheus-HIBP
    orgId: 1
  - name: Infinity
    orgId: 1

datasources:
  - name: Prometheus
    uid: oryth-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
