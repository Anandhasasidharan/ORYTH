services:
  grafana:
    image: grafana/grafana:12.3.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - censys
      - xposedornot
    restart: unless-stopped

  censys:
    build: .
    environment:
      CENSYS_TOKEN: ${CENSYS_TOKEN:-}
      MY_PUBLIC_IP: ${MY_PUBLIC_IP:-}
      CENSYS_ORGANIZATION_ID: ${CENSYS_ORGANIZATION_ID:-}
      DATA_DIR: /data
    volumes:
      - ./data:/data
    command: ["python", "scripts/censys-monitor.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  xposedornot:
    build: .
    environment:
      MY_EMAILS: ${MY_EMAILS:-}
      DATA_DIR: /data
    volumes:
      - ./data:/data
    command: ["python", "scripts/xposedornot-monitor.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/metrics', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  grafana-data:
  prometheus-data:
